function mstart(m){return fm(m.s+mdelay(m))}
function mrange(m){var d=mdelay(m);return fm(m.s+d)+'–'+fm(m.e+d)}
function status(m){if(res(m).done)return 'done';var c=ST[m.stream].cur;if(c===m.ord)return 'live';if(c>m.ord)return 'wait';return 'plan'}
function nstream(id){return S.matches.filter(function(m){return m.stream===id}).length}
function fmtDate(s){if(!s)return '';var d=new Date(s+'T00:00:00');if(isNaN(d))return '';return (d.getMonth()+1)+'月'+d.getDate()+'日('+DOW[d.getDay()]+')'}
function pairMatch(a,b,st){return S.matches.find(function(m){if(m.stage!==st)return false;var t=teamsOf(m);return (t[0]===a&&t[1]===b)||(t[0]===b&&t[1]===a)})}
function h2h(a,b,st){var m=pairMatch(a,b,st);if(!m)return 0;var r=res(m);if(!r.done)return 0;return teamsOf(m)[r.win-1]===a?-1:1}
function remAdd(m,a,c){var rm=m.rem||[];(m.sets||[]).forEach(function(v,i){var q=rm[i];if(!q||q[0]==null||q[1]==null)return;a.rs+=q[0];a.cs+=8-q[1];c.rs+=q[1];c.cs+=8-q[0]})}
function cmpRows(x,y,st){return y.pts-x.pts||y.rs-x.rs||y.cs-x.cs||h2h(x.id,y.id,st)}
function hasTie(rows,st){for(var i=0;i<rows.length-1;i++)if(cmpRows(rows[i],rows[i+1],st)===0)return true;return false}
function remMissing(ms){return ms.some(function(m){return res(m).done&&(m.sets||[]).some(function(v,i){var q=(m.rem||[])[i];return !(q&&q[0]!=null&&q[1]!=null)})})}
function standings(b){
  var R={},rows=S.teams.filter(function(t){return t.block===b}).map(function(t){var o={id:t.id,p:0,w:0,l:0,pts:0,rs:0,cs:0};R[t.id]=o;return o});
  S.matches.forEach(function(m){
    if(m.stage!=='league'||m.block!==b)return;var r=res(m);if(!r.done)return;
    var a=R[m.t[0]],c=R[m.t[1]];a.p++;c.p++;remAdd(m,a,c);
    if(r.win===1){a.w++;c.l++;a.pts+=(r.w2===0?2:1)}else{c.w++;a.l++;c.pts+=(r.w1===0?2:1)}
  });
  rows.sort(function(x,y){return cmpRows(x,y,'league')||(x.id<y.id?-1:1)});
  return rows;
}
function blockDone(b){return S.matches.filter(function(m){return m.stage==='league'&&m.block===b}).every(function(m){return res(m).done})}
function leagueDone(){return BL.every(blockDone)}
function lbMatches(g){return S.matches.filter(function(m){return m.stage==='lb'&&m.grp===g})}
function lbRows(g){
  var L=S.lb[g],ids=L.from.map(function(b){return ref('R:'+b+':3')});
  if(ids.some(function(x){return !x}))return null;
  var R={},rows=ids.map(function(id){var o={id:id,p:0,w:0,l:0,pts:0,rs:0,cs:0};R[id]=o;return o});
  var ms=lbMatches(g);
  ms.forEach(function(m){var r=res(m);if(!r.done)return;var t=teamsOf(m);if(!R[t[0]]||!R[t[1]])return;var a=R[t[0]],c=R[t[1]];a.p++;c.p++;remAdd(m,a,c);if(r.win===1){a.w++;c.l++;a.pts++}else{c.w++;a.l++;c.pts++}});
  rows.sort(function(x,y){return cmpRows(x,y,'lb')||(x.id<y.id?-1:1)});
  var done=ms.every(function(m){return res(m).done});
  return {list:rows,done:done,tie:done&&hasTie(rows,'lb'),ms:ms};
}
function lbDone(){return lbMatches('AM').every(function(m){return res(m).done})&&lbMatches('PM').every(function(m){return res(m).done})}
function podium(mg){
  var F=res(M.F),P=res(M.TP),tf=teamsOf(M.F),tp=teamsOf(M.TP),h='';
  if(!F.done&&!P.done)return '';
  h+='<div style="margin:'+mg+'">';
  if(F.done)h+='<div class="champ" style="margin:0 0 8px"><span class="small">優勝</span><b>'+esc(tn(tf[F.win-1]))+'</b></div>';
  var it=[];
  if(F.done)it.push(['準優勝',tf[2-F.win]]);
  if(P.done){it.push(['第3位',tp[P.win-1]]);it.push(['第4位',tp[2-P.win]])}
  h+='<div class="pod">'+it.map(function(x){return '<div><span class="small">'+x[0]+'</span><b>'+esc(tn(x[1]))+'</b></div>'}).join('')+'</div></div>';
  return h;
}
function champion(){var f=M.F,r=res(f);if(!r.done)return null;return teamsOf(f)[r.win-1]}
function myMatches(id){return S.matches.filter(function(m){return teamsOf(m).indexOf(id)>=0}).sort(function(a,b){return a.day-b.day||a.s-b.s})}
/* ---------- views ---------- */
function nameHtml(id,fb){
  if(!id)return '<span class="nm">'+esc(fb||'未定')+'</span>';
  var t=T[id];return '<span class="nm">'+esc(t.name)+(t.name!==t.id?'<span class="code">'+esc(t.id)+'</span>':'')+'</span>';
}
function matchCard(m){
  var ts=teamsOf(m),r=res(m),st=status(m),lab={done:'終了',live:'試合中',wait:'結果待ち',plan:'予定'}[st];
  var h='<article class="mc'+(st==='live'?' live':'')+'" id="m-'+m.id+'"><div class="mc-h"><span>'+esc(m.tag)+'</span><span class="num">'+mrange(m)+'</span><span>'+esc(ST[m.stream].name)+'</span>'+(m.warm?'<span class="chip warm">アップ5分込み</span>':'')+'<span class="sp"></span><span class="chip '+(st==='plan'?'':st)+'">'+lab+'</span></div>';
  for(var i=0;i<2;i++){
    var id=ts[i],cl='row';
    if(r.done)cl+=(r.win===i+1?' win':' lose');
    if(id&&id===ui.my)cl+=' me';
    if(!id)cl+=' tbd';
    var sc=(m.sets||[]).length?(i===0?r.w1:r.w2):'';
    h+='<div class="'+cl+'">'+nameHtml(id,refLabel(m.t[i]))+'<span class="sc">'+sc+'</span></div>';
  }
  var jr=(m.jr||[]).map(function(x){var q=ref(x);return {id:q,l:q?tn(q):refLabel(x)}});
  h+='<div class="jr'+(jr.some(function(j){return j.id&&j.id===ui.my})?' me':'')+'"><span class="jl">審判</span>'+(jr.length?jr.map(function(j){return esc(j.l)}).join('・'):'運営')+'</div>';
  if(ui.admin&&ts[0]&&ts[1])h+='<div class="adm"><button class="btn sm" data-act="edit" data-id="'+m.id+'">結果を入力</button></div>';
  return h+'</article>';
}
function cards(ms){return '<div class="list">'+ms.map(matchCard).join('')+'</div>'}
function heroHtml(){
  var d=activeDay(),day=S.days[d-1],ms=S.matches.filter(function(m){return m.day===d});
  var done=ms.filter(function(m){return res(m).done}).length;
  var h='<section class="sec hero"><div class="kv"><h2 style="margin:0">'+esc(day.label)+' '+esc(day.title)+'</h2><span class="muted small">'+fmtDate(day.date)+' '+esc(day.venue)+'</span></div>';
  if(d===2)h+=podium('10px 0 0');
  h+='<div class="bar"><i style="width:'+Math.round(done/ms.length*100)+'%"></i></div><div class="small muted">'+ms.length+'試合中 '+done+'試合が終了</div>';
  h+=shiftNote(d);
  var live=ms.filter(function(m){return status(m)==='live'}).sort(function(a,b){return a.s-b.s});
  var nx=[];
  S.streams.filter(function(s){return s.day===d}).forEach(function(s){
    var from=s.cur<0?0:s.cur+1;
    var m=S.matches.filter(function(m){return m.stream===s.id&&m.ord>=from&&!res(m).done}).sort(function(a,b){return a.ord-b.ord})[0];
    if(m&&m.ord>=from)nx.push(m);
  });
  nx=nx.filter(function(m){return status(m)!=='live'}).sort(function(a,b){return a.s+mdelay(a)-b.s-mdelay(b)});
  if(nx.length){var t0=nx[0].s+mdelay(nx[0]);nx=nx.filter(function(m){return m.s+mdelay(m)<=t0+60}).slice(0,6)}
  if(live.length)h+='<h3 style="margin-top:12px"><span class="chip live">いま</span></h3>'+cards(live);
  if(nx.length)h+='<h3 style="margin-top:14px"><span class="chip">'+(live.length?'次':'最初の試合')+'</span></h3>'+cards(nx);
  if(!live.length&&!nx.length)h+='<p class="small muted" style="margin:10px 0 0">この日の試合はすべて終了しました。</p>';
  else if(!live.length&&S.streams.filter(function(s){return s.day===d}).every(function(s){return s.cur<0}))h+='<p class="small muted" style="margin:10px 0 0">まだ開始前です。運営が進行を開始すると「いま」の試合が表示されます。</p>';
  return h+'</section>';
}
function myTeamHtml(){

    var st=status(nx),ts=teamsOf(nx),oi=ts[0]===id?1:0,gap=nx.ord-Math.max(ST[nx.stream].cur,0);
    var when=st==='live'?'いま試合中です':st==='wait'?'結果待ち（まもなく呼ばれます）':(gap<=0?'次に呼ばれます':'同じコートで、あと'+gap+'試合');
    h+='<div class="next" style="margin-top:10px"><div class="kv"><span class="chip live">次の試合</span><span class="muted small">'+esc(nx.tag)+'</span></div>'
      +'<div class="kv" style="margin-top:6px"><span class="big">'+mstart(nx)+'</span><span style="font-size:20px;font-weight:900">'+esc(ST[nx.stream].name)+'</span></div>'
      +'<div class="vs">対 '+esc(ts[oi]?tn(ts[oi]):refLabel(nx.t[oi]))+'</div><div class="small" style="font-weight:700">'+when+(nx.warm?'（開始前にアップ5分）':'')+'</div></div>';
  }else{

    else msg='次の対戦相手が決まるまでお待ちください。';
    h+='<div class="card" style="margin-top:10px"><b>'+(ms.length&&ms.every(function(m){return res(m).done})?'いまの予定はすべて終了':'次の試合は未定')+'</b><div class="small muted">'+msg+'</div></div>';
  }

  var b=T[id].block,pos=standings(b).findIndex(function(r){return r.id===id})+1;
  h+='<p class="small muted" style="margin:8px 0 0">'+b+'リーグの現在順位: '+pos+'位'+(blockDone(b)?'（確定）':'（暫定）')+'</p>';

function filterOk(m,f){
  if(f==='all')return true;
  if(f==='LB')return m.stage==='lb';
  if(f==='ko'||f==='fm')return m.stage===f;
  if(f==='CA'||f==='CB')return m.stream===f;
  return m.block===f;
}

  else if(ui.tab==='admin'&&ui.admin)body=adminHtml();
  var foot=ui.admin?'':'<footer class="f"><div>表示は、運営が結果を入力するたびに、約'+Math.round(POLL/1000)+'秒ごとに自動で更新されます。</div>'+(ui.net===false?'<div class="small" style="margin-top:6px;color:var(--ball)">最新の情報を取得できません。電波の良い場所で、ページを開き直してください。</div>':'')+'<button class="btn ghost sm" data-act="login">運営の方はこちら</button></footer>';
  app.innerHTML='<header class="top"><div class="top-in"><div class="brand">MM CUP2026<small>ドッジボール大会 進行表</small></div><div class="upd">最終更新<br><span class="num" style="font-size:16px;font-weight:700">'+esc(updText()||'—')+'</span></div><span class="court-mark"></span></div></header><main class="wrap" aria-live="polite">'+body+(ui.tab==='admin'?'':foot)+'</main>'
    +(ui.dirty?'<div class="pubbar"><span>未公開の変更 '+ui.dirty+'件</span><button class="btn" data-act="publish"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'公開中…':'公開する')+'</button></div>':'')
    +navHtml()+(ui.edit?sheetHtml():'')+(ui.pinAsk?pinHtml():'')+(ui.toast?'<div class="toast" role="status">'+esc(ui.toast)+'</div>':'');
  window.scrollTo(0,y);
  if(ui.pinAsk){var pi=document.getElementById('pin-in');if(pi&&document.activeElement!==pi)pi.focus()}
}
var tt=0;
function toast(t){ui.toast=t;render();clearTimeout(tt);tt=setTimeout(function(){ui.toast='';render()},4200)}
function remember(){sset('mm_ui',JSON.stringify({tab:ui.tab,day:ui.day,admin:ui.admin,kt:ui.kt}))}
function touch(){ui.dirty++}
/* ---------- sync (Firebase Realtime Database / REST) ---------- */
var CFG=window.MM_CONFIG||{},DB=String(CFG.dbUrl||'').replace(/\/+$/,''),POLL=(+CFG.pollSec||30)*1000;
function overlay(){
  var o={};
  S.matches.forEach(function(m){o['m/'+m.id]=JSON.stringify({s:m.sets||[],r:m.rem||[]})});
  S.streams.forEach(function(s){o['s/'+s.id]=JSON.stringify({c:s.cur,d:s.delay||0,r:s.dir||''})});
  S.teams.forEach(function(t){o['n/'+t.id]=t.name});
  o['x/o']=JSON.stringify(S.ko.over||{});
  return o;
}
function applyKey(k,v){
  var i=k.indexOf('/'),ty=k.slice(0,i),id=k.slice(i+1),o;
  try{
    if(ty==='m'){var m=M[id];if(!m)return;o=JSON.parse(v);m.sets=o.s||[];m.rem=o.r||[]}
    else if(ty==='s'){var s=ST[id];if(!s)return;o=JSON.parse(v);s.cur=+o.c;s.delay=+o.d||0;if(o.r)s.dir=o.r;else delete s.dir}
    else if(ty==='n'){var t=T[id];if(t)t.name=v||t.id}
    else if(ty==='x'&&id==='o'){S.ko.over=JSON.parse(v)||{}}
  }catch(e){}
}
var base=overlay(),pending=false;
function pull(){
  if(!DB)return Promise.resolve();
  return fetch(DB+'/mm/pub.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var was=ui.net;ui.net=true;
    var rem={};
    if(j&&typeof j==='object')Object.keys(j).forEach(function(sec){var o=j[sec];if(o&&typeof o==='object')Object.keys(o).forEach(function(k){if(typeof o[k]==='string')rem[sec+'/'+k]=o[k]})});
    var loc=overlay(),ch=false,adopt=[];
    Object.keys(rem).forEach(function(k){
      if(k==='x/u'){if(S.updated!==rem[k]){S.updated=rem[k];ch=true}return}
      if(loc[k]===base[k]){if(loc[k]!==rem[k]){applyKey(k,rem[k]);ch=true}adopt.push(k)}
      else base[k]=rem[k];
    });
    var cur=overlay();adopt.forEach(function(k){base[k]=cur[k]});
    if(ch||was!==true){if(ui.edit||ui.pinAsk)pending=true;else render()}
  }).catch(function(){var was=ui.net;ui.net=false;if(was!==false&&!ui.edit&&!ui.pinAsk)render()});
}
function stamp(){var t=String(Date.now());return {t:t,pin:ui.pinTry+t}}
async function patch(body){
  var r=await fetch(DB+'/mm.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401||r.status===403)throw {code:'pin'};
  if(!r.ok)throw {code:'net'};
}
async function verifyPin(p){
  ui.pinTry=p;var st=stamp();await patch({t:st.t,pin:st.pin});
}
async function publish(){
  if(ui.busy||!ui.dirty)return;
  if(!DB){toast('保存先が未設定のため、公開できません。');return}
  ui.busy=true;render();
  try{
    var loc=overlay(),body={},st;
    Object.keys(loc).forEach(function(k){if(loc[k]!==base[k])body['pub/'+k]=loc[k]});
    var iso=new Date().toISOString();body['pub/x/u']=iso;
    ui.pinTry=ui.pin;st=stamp();body.t=st.t;body.pin=st.pin;
    await patch(body);
    Object.keys(loc).forEach(function(k){base[k]=loc[k]});
    S.updated=iso;ui.dirty=0;ui.busy=false;remember();
    toast('公開しました。全員の画面に、約'+Math.round(POLL/1000)+'秒以内に反映されます。');
  }catch(e){
    ui.busy=false;
    var c=e&&e.code,msg='公開できませんでした。通信を確認して、もう一度お試しください。入力した内容はこの端末に残っています。';
    if(c==='pin'){ui.pin='';lset('mm_pin','');ui.pinAsk=true;msg='PINが違うか、変更されました。もう一度PINを入力してください。'}
    toast(msg);
  }
}
async function login(){
  if(!DB||ui.pin){ui.admin=true;ui.tab='admin';remember();render();return}
  ui.pinAsk=true;render();
}
async function pinOk(){
  var el=document.getElementById('pin-in'),p=el?String(el.value||'').trim():'';
  if(!p){toast('PINを入力してください。');return}
  try{await verifyPin(p)}catch(e){toast(e&&e.code==='pin'?'PINが違います。':'通信できませんでした。もう一度お試しください。');return}
  ui.pin=p;lset('mm_pin',p);ui.pinAsk=false;ui.admin=true;ui.tab='admin';remember();render();
}
/* ---------- events ---------- */
function act(a,d,el,e){
  if(a==='tab'){ui.tab=d.t;remember();render();window.scrollTo(0,0);return}
  if(a==='day'){ui.day=+d.d;ui.filter='all';remember();render();return}
  if(a==='filter'){ui.filter=d.f;render();return}
  if(a==='kt'){ui.kt=d.k;remember();render();return}
  if(a==='onlyme'){ui.onlyMe=!ui.onlyMe;render();return}
  if(a==='prt'){openPrint(d.m);return}
  if(a==='login'){login();return}
  if(a==='pinok'){pinOk();return}
  if(a==='pincancel'){ui.pinAsk=false;render();return}
  if(a==='pinbg'){if(e.target===el){ui.pinAsk=false;render()}return}
  if(a==='exitadmin'){ui.admin=false;ui.tab='home';remember();render();return}
  if(a==='publish'){publish();return}
  if(a==='bg'){if(e.target===el){ui.edit=null;render()}return}
  if(a==='close'){ui.edit=null;render();return}
  if(a==='edit'){var m=M[d.id],ss=m.sets||[];ui.edit=d.id;ui.draft=[ss[0]||0,ss[1]||0,ss[2]||0];ui.draftRem=[0,1,2].map(function(i){var q=(m.rem||[])[i];return q?[q[0],q[1]]:[null,null]});render();return}
  if(a==='setw'){ui.draft[+d.i]=+d.v;render();return}
  if(a==='clear'){M[ui.edit].sets=[];M[ui.edit].rem=[];ui.edit=null;touch();render();return}
  if(a==='save'){
    var m2=M[ui.edit],w1=0,w2=0,sets=[],nd=need(m2),n=m2.bo===1?1:3;
    for(var i=0;i<n;i++){if(w1>=nd||w2>=nd)break;var v=ui.draft[i];sets.push(v);if(v===1)w1++;else if(v===2)w2++}
    while(sets.length&&sets[sets.length-1]===0)sets.pop();
    m2.sets=sets;m2.rem=sets.map(function(v,i){var q=ui.draftRem[i];return (q&&q[0]!=null&&q[1]!=null)?[q[0],q[1]]:[null,null]});
    if(res(m2).done){var s=ST[m2.stream];s.cur=Math.min(Math.max(s.cur,m2.ord+1),nstream(s.id))}
    ui.edit=null;touch();render();return;
  }
  if(a==='cur'){var s2=ST[d.s];s2.cur=Math.max(-1,Math.min(nstream(s2.id),s2.cur+(+d.v)));touch();render();return}
}
app.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el.dataset,el,e)});
app.addEventListener('change',function(e){
  var el=e.target.closest('[data-chg]');if(!el)return;var k=el.dataset.chg,v=el.value;
  if(k==='rem'){ui.draftRem[+el.dataset.i][+el.dataset.k]=v===''?null:+v;return}
  if(k==='my'){ui.my=v;lset('mm_my',v);render();return}
  if(k==='tname'){var t=T[el.dataset.id];t.name=(v||'').trim()||t.id;touch();render();return}
  if(k==='delay'){var s3=ST[el.dataset.s],n3=Math.max(0,Math.min(180,parseInt(v,10)||0));s3.delay=(s3.dir==='early'||(!s3.dir&&s3.delay<0))?-n3:n3;touch();render();return}
  if(k==='dir'){var s4=ST[el.dataset.s];s4.dir=v;s4.delay=(v==='early'?-1:1)*Math.abs(s4.delay||0);touch();render();return}
  if(k==='over'){if(v)S.ko.over[el.dataset.r]=v;else delete S.ko.over[el.dataset.r];touch();render();return}
});
render();
if(ui.pinAsk===false){}
pull();
setInterval(function(){if(!document.hidden)pull()},POLL);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
})();
</script>
</body></html>
