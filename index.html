var b8={nm:{},nkey:'',ok:false,pin:sget('mm_b8pin')||'',key:'',r:{},v:{},cfg:null,cdr:null,team:lget('mm_b8t')||'',sel:{o:{},d:{},k:{}},touched:false,busy:false,msg:'',view:'vote',rt:'',adm:false,fin:null,finKey:'',finTouched:false};
function b8Roster(id){try{var a=JSON.parse(b8.r[id]||'[]');return Array.isArray(a)?a.map(function(p){return [p[0]]}):[]}catch(e){return[]}}
function b8Names(id){var a=null;try{a=JSON.parse((b8.nm&&b8.nm[id])||'null')}catch(e){}if(!Array.isArray(a)){try{a=JSON.parse(b8.r[id]||'[]')}catch(e){a=[]}}return Array.isArray(a)?a.filter(function(p){return p[1]}):[]}

function b8Parse(s){try{var o=JSON.parse(s||'null');return o&&typeof o==='object'?{o:o.o||[],d:o.d||[],k:o.k||[]}:null}catch(e){return null}}

function b8Count(c){return Object.keys(b8.sel[c]).filter(function(k){return b8.sel[c][k]}).length}
function b8Tally(){
  var tg=b8Targets(),cnt={o:{},d:{},k:{}},pl=[],n=0,res={ballots:0,cats:{}};
  tg.forEach(function(t){b8Roster(t).forEach(function(p){var id=t+':'+p[0];pl.push({id:id,t:t,n:p[0],name:b8Nm(t,p[0])||'（氏名未登録）'});B8Q.forEach(function(q){cnt[q[0]][id]=0})})});
  Object.keys(b8.v).forEach(function(k){if(k.indexOf('b_')!==0)return;var bl=b8Parse(b8.v[k]);if(!bl)return;n++;B8Q.forEach(function(q){bl[q[0]].forEach(function(id){if(id in cnt[q[0]])cnt[q[0]][id]++})})});
  res.ballots=n;

    var c=q[0],N=q[2],rows=pl.map(function(p){return {id:p.id,t:p.t,n:p.n,name:p.name,c:cnt[c][p.id]}}).filter(function(r){return r.c>0});
    rows.sort(function(a,b){return b.c-a.c||(a.t<b.t?-1:a.t>b.t?1:0)||((parseInt(a.n,10)||0)-(parseInt(b.n,10)||0))});

    var cN=rows.length>=N?rows[N-1].c:0,above=rows.filter(function(r){return r.c>cN}).length,tie=rows.filter(function(r){return r.c===cN}).length;

    +navHtml()+(ui.edit?sheetHtml():'')+(ui.pinAsk?pinHtml():'')+(ui.toast?'<div class="toast" role="status">'+esc(ui.toast)+'</div>':'');

var tt=0;
function toast(t){ui.toast=t;render();clearTimeout(tt);tt=setTimeout(function(){ui.toast='';render()},4200)}

/* ---------- sync (Firebase Realtime Database / REST) ---------- */
var CFG=window.MM_CONFIG||{},DB=String(CFG.dbUrl||'').replace(/\/+$/,''),POLL=(+CFG.pollSec||30)*1000;
function overlay(){
  var o={};
  S.matches.forEach(function(m){o['m/'+m.id]=JSON.stringify({s:m.sets||[],r:m.rem||[],f:m.f||0})});
  S.streams.forEach(function(s){o['s/'+s.id]=JSON.stringify({c:s.cur,d:s.delay||0,r:s.dir||'',m:s.man?1:0})});
  S.teams.forEach(function(t){o['n/'+t.id]=t.name});
  o['x/o']=JSON.stringify(S.ko.over||{});
  o['x/b8']=S.b8?JSON.stringify(S.b8):'';
  return o;
}
function applyKey(k,v){
  var i=k.indexOf('/'),ty=k.slice(0,i),id=k.slice(i+1),o;
  try{
    if(ty==='m'){var m=M[id];if(!m)return;o=JSON.parse(v);m.sets=o.s||[];m.rem=o.r||[];m.f=+o.f||0}
    else if(ty==='s'){var s=ST[id];if(!s)return;o=JSON.parse(v);s.cur=+o.c;s.delay=+o.d||0;s.man=o.m?1:0;if(o.r)s.dir=o.r;else delete s.dir}
    else if(ty==='n'){var t=T[id];if(t)t.name=v||t.id}
    else if(ty==='x'&&id==='o'){S.ko.over=JSON.parse(v)||{}}
    else if(ty==='x'&&id==='b8'){S.b8=v?JSON.parse(v):null}
  }catch(e){}
}
var base=overlay(),pending=false;
function pull(){
  if(!DB)return Promise.resolve();
  return fetch(DB+'/mm/pub.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var was=ui.net;ui.net=true;
    var rem={};
    if(j&&typeof j==='object')Object.keys(j).forEach(function(sec){var o=j[sec];if(o&&typeof o==='object')Object.keys(o).forEach(function(k){if(typeof o[k]==='string')rem[sec+'/'+k]=o[k]})});
    var loc=overlay(),ch=false,adopt=[];
    Object.keys(rem).forEach(function(k){
      if(k==='x/u'){if(S.updated!==rem[k]){S.updated=rem[k];ch=true}return}
      if(loc[k]===base[k]){if(loc[k]!==rem[k]){applyKey(k,rem[k]);ch=true}adopt.push(k)}
      else base[k]=rem[k];
    });
    var cur=overlay();adopt.forEach(function(k){base[k]=cur[k]});
    if(ch||was!==true){if(ui.edit||ui.pinAsk||ui.tab==='b8')pending=true;else render()}
  }).catch(function(){var was=ui.net;ui.net=false;if(was!==false&&!ui.edit&&!ui.pinAsk)render()});
}
function stamp(){var t=String(Date.now());return {t:t,pin:ui.pinTry+t}}
async function patch(body){
  var r=await fetch(DB+'/mm.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401||r.status===403)throw {code:'pin'};

}

/* ---- ベスト8プレイヤー（別PIN・別の保存先 /b8/<PINから作る鍵>） ---- */
async function b8Sha(p,sl){
  if(!(window.crypto&&crypto.subtle))throw {code:'crypto'};
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode((sl||'mmcup2026-b8:')+p));
  return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
}
async function b8Patch(body,key){
  var t=String(Date.now()),o={pin:b8.pin+t,t:t};
  Object.keys(body||{}).forEach(function(k){o[k]=body[k]});
  var r=await fetch(DB+'/b8/'+(key||b8.key)+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
  if(r.status===401||r.status===403)throw {code:'pin'};
  if(!r.ok)throw {code:'net'};
}
async function b8Load(){
  var rs=await Promise.all(['r','v','c'].map(function(k){return fetch(DB+'/b8/'+b8.key+'/'+k+'.json',{cache:'no-store'}).then(function(x){if(!x.ok)throw 0;return x.json()})}));
  b8.r=rs[0]||{};b8.v=rs[1]||{};
  if(b8.adm){try{await b8LoadNames()}catch(e){}}
  try{b8.cfg=rs[2]?JSON.parse(rs[2]):null}catch(e){b8.cfg=null}
}
async function b8LoadNames(){
  if(!(b8.adm&&ui.pin)){b8.nm={};return}
  if(!b8.nkey)b8.nkey=await b8Sha(ui.pin,'mmcup2026-b8n:');
  var x=await fetch(DB+'/b8/'+b8.nkey+'/r.json',{cache:'no-store'});
  if(!x.ok)throw 0;b8.nm=(await x.json())||{};
}
async function b8Enter(auto){

  b8.busy=true;b8.msg='';b8.pin=p;render();

    b8.key=await b8Sha(p);await b8Patch({});await b8Load();
    b8.ok=true;sset('mm_b8pin',p);b8.busy=false;b8InitSel();if(ui.pin){b8.adm=true;try{await b8LoadNames()}catch(e){}}render();
  }catch(e){
    b8.ok=false;b8.busy=false;sset('mm_b8pin','');
    b8.msg=e&&e.code==='pin'?'PINが違います。':(e&&e.code==='crypto'?'この端末のブラウザでは使えません。別のブラウザでお試しください。':'通信できませんでした。もう一度お試しください。');
    render();
  }
}
async function b8Admin2(){
  var el=document.getElementById('b8-apin'),p=el?String(el.value||'').trim():'';
  if(!p){b8.msg='PINを入力してください。';render();return}

}
async function b8Send(){
  if(!b8.team){toast('あなたのチームを選んでください。');return}
  var ob={},tot=0;
  B8Q.forEach(function(q){var ids=Object.keys(b8.sel[q[0]]).filter(function(k){return b8.sel[q[0]][k]});ob[q[0]]=ids;tot+=ids.length;if(ids.length>q[2])ob.bad=1});

}
async function b8Rsave(){
  var tid=b8.rt,el=document.getElementById('b8-rost');
  if(!tid||!el)return;
  var rows=[],seen={},bad='';
  String(el.value||'').split(/\r?\n/).forEach(function(line,i){
    line=line.normalize('NFKC').trim();if(!line)return;
    var m=line.match(/^([^\s,，、\t]+)[\s,，、\t]+(.+)$/);
    if(!m){bad=(i+1)+'行目に、背番号と氏名の両方を入れてください。';return}
    var num=m[1],name=m[2].replace(/\s+/g,' ').trim();
    if(seen[num]){bad='背番号'+num+'が重なっています。';return}
    if(name.length>20){bad=(i+1)+'行目の氏名が長すぎます。';return}
    seen[num]=1;rows.push([num,name]);
  });
  if(bad){b8.msg=bad;render();return}
  if(rows.length>30){b8.msg='登録できるのは、1チーム30人までです。';render();return}
  b8.busy=true;b8.msg='';render();
  try{
    if(!ui.pin)throw {code:'pin'};
    if(!b8.nkey)b8.nkey=await b8Sha(ui.pin,'mmcup2026-b8n:');
    var o={},on={},val=JSON.stringify(rows),nums=JSON.stringify(rows.map(function(p){return [p[0]]}));on['r/'+tid]=val;o['r/'+tid]=nums;
    await b8Patch(on,b8.nkey);b8.nm=b8.nm||{};b8.nm[tid]=val;
    await b8Patch(o);b8.r[tid]=nums;b8.busy=false;b8.msg=tn(tid)+'の名簿を保存しました（'+rows.length+'人）。';render();
  }catch(e){b8.busy=false;b8.msg=e&&e.code==='pin'?'PINが違うか、変更されました。開き直してください。':'保存できませんでした。もう一度お試しください。';render()}
}
async function b8Pub(){
  var T8=b8Tally(),out=[];
  B8Q.forEach(function(q){T8.cats[q[0]].rows.filter(function(r){return b8.fin[q[0]][r.id]}).forEach(function(r){out.push([q[0],tn(r.t),r.n,r.name])})});

setInterval(function(){
  if(ui.tab!=='b8'||!b8.ok||document.hidden)return;
  var ae=document.activeElement,tg=ae&&ae.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;

if(ui.tab==='b8'&&b8.pin&&DB)setTimeout(function(){b8Enter(b8.pin)},0);
/* ---------- events ---------- */
function act(a,d,el,e){
  if(a==='tab'){ui.tab=d.t;remember();render();window.scrollTo(0,0);if(d.t==='b8'&&!b8.ok&&b8.pin&&!b8.busy&&typeof b8Enter==='function')b8Enter(b8.pin);return}

  if(a==='b8enter'){b8Enter();return}
  if(a==='b8admin'){b8Admin2();return}
  if(a==='b8pick'){var cq=B8Q.filter(function(q){return q[0]===d.c})[0],was=!!b8.sel[d.c][d.id];if(!was&&b8Count(d.c)>=cq[2]){toast(cq[1]+'は、最大'+cq[2]+'人までです。');return}if(was)delete b8.sel[d.c][d.id];else b8.sel[d.c][d.id]=1;b8.touched=true;render();return}

  if(a==='b8cfgsave'){b8Cfg(true);return}
  if(a==='b8cfgoff'){b8Cfg(false);return}
  if(a==='b8send'){b8Send();return}
  if(a==='b8rsave'){b8Rsave();return}
  if(a==='b8pub'){b8Pub();return}
  if(a==='b8unpub'){b8Unpub();return}
  if(a==='day'){ui.day=+d.d;ui.filter='all';remember();render();return}
  if(a==='filter'){ui.filter=d.f;render();return}

  if(a==='onlyme'){ui.onlyMe=!ui.onlyMe;render();return}
  if(a==='prt'){openPrint(d.m);return}

  if(a==='pinok'){pinOk();return}
  if(a==='pincancel'){ui.pinAsk=false;render();return}
  if(a==='pinbg'){if(e.target===el){ui.pinAsk=false;render()}return}
  if(a==='exitadmin'){ui.admin=false;ui.tab='home';remember();render();return}

  if(a==='bg'){if(e.target===el){ui.edit=null;render()}return}

  if(a==='edit'){var m=M[d.id],ss=m.sets||[];ui.edit=d.id;ui.draft=[ss[0]||0,ss[1]||0,ss[2]||0];ui.draftRem=[0,1,2].map(function(i){var q=(m.rem||[])[i];return q?[q[0],q[1]]:[null,null]});render();return}
  if(a==='setw'){ui.draft[+d.i]=+d.v;render();return}
  if(a==='clear'){M[ui.edit].sets=[];M[ui.edit].rem=[];M[ui.edit].f=0;ui.edit=null;touch();render();return}
  if(a==='save'){
    var m2=M[ui.edit],w1=0,w2=0,sets=[],nd=need(m2),n=m2.bo===1?1:3;var wasDone=res(m2).done;
    for(var i=0;i<n;i++){if(w1>=nd||w2>=nd)break;var v=ui.draft[i];sets.push(v);if(v===1)w1++;else if(v===2)w2++}
    while(sets.length&&sets[sets.length-1]===0)sets.pop();
    m2.sets=sets;m2.rem=sets.map(function(v,i){var q=ui.draftRem[i];return (q&&q[0]!=null&&q[1]!=null)?[q[0],q[1]]:[null,null]});
    if(res(m2).done){if(!wasDone||!m2.f)m2.f=Date.now()}else m2.f=0;
    if(res(m2).done){var s=ST[m2.stream];s.cur=Math.min(Math.max(s.cur,m2.ord+1),nstream(s.id))}
    ui.edit=null;touch();render();return;
  }
  if(a==='auto'){var s5=ST[d.s];s5.man=0;s5.delay=0;delete s5.dir;touch();render();return}
  if(a==='cur'){var s2=ST[d.s];s2.cur=Math.max(-1,Math.min(nstream(s2.id),s2.cur+(+d.v)));touch();render();return}
}
app.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el.dataset,el,e)});

  if(k==='over'){if(v)S.ko.over[el.dataset.r]=v;else delete S.ko.over[el.dataset.r];touch();render();return}
});

if(ui.pinAsk===false){}

})();
